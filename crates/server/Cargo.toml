[package]
name = "Offset-server"
version = "0.1.0"
edition = "2021"

[dependencies]
risk-engine = { path = "../risk-engine" }
execution = { path = "../execution" }
data = { path = "../data" }
replay = { path = "../replay" }

axum = "0.8"
async-graphql = { version = "7", features = ["chrono", "decimal", "uuid"] }
async-graphql-axum = "7"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["time"] }
futures-util = "0.3"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "chrono", "uuid", "rust_decimal", "macros"] }
redis = { version = "0.27", features = ["tokio-comp"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
rust_decimal_macros = "1.36"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
