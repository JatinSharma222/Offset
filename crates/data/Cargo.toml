[package]
name = "data"
version = "0.1.0"
edition = "2021"

[dependencies]
risk-engine = { path = "../risk-engine" }
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
